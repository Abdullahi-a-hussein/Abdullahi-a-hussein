<svg width="1200" height="220" viewBox="0 0 1200 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1b26">
        <animate attributeName="stop-color" values="#1a1b26;#24283b;#1f2335;#1a1b26" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#24283b">
        <animate attributeName="stop-color" values="#24283b;#414868;#2f3549;#24283b" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#1f2335">
        <animate attributeName="stop-color" values="#1f2335;#1a1b26;#24283b;#1f2335" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="wave1" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#bb9af7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7dcfff" stop-opacity="0.65"/>
    </linearGradient>

    <linearGradient id="wave2" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2ac3de" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#7aa2f7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0.35"/>
    </linearGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="1200" height="220" fill="url(#bg)"/>

  <circle cx="180" cy="60" r="70" fill="#7aa2f7" opacity="0.08" filter="url(#blur)">
    <animate attributeName="cx" values="180;220;180" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="140" r="90" fill="#bb9af7" opacity="0.08" filter="url(#blur)">
    <animate attributeName="cx" values="980;930;980" dur="14s" repeatCount="indefinite"/>
  </circle>

  <path d="M0 150 C 130 120, 250 200, 400 160 C 570 115, 720 210, 900 165 C 1030 132, 1120 145, 1200 120 L1200 220 L0 220 Z"
        fill="url(#wave1)">
    <animate attributeName="d"
      values="
      M0 150 C 130 120, 250 200, 400 160 C 570 115, 720 210, 900 165 C 1030 132, 1120 145, 1200 120 L1200 220 L0 220 Z;
      M0 140 C 120 170, 270 120, 430 155 C 560 183, 730 120, 900 150 C 1035 175, 1125 110, 1200 130 L1200 220 L0 220 Z;
      M0 150 C 130 120, 250 200, 400 160 C 570 115, 720 210, 900 165 C 1030 132, 1120 145, 1200 120 L1200 220 L0 220 Z"
      dur="11s" repeatCount="indefinite"/>
  </path>

  <path d="M0 170 C 140 140, 250 215, 410 185 C 560 155, 760 215, 920 180 C 1060 150, 1130 185, 1200 168 L1200 220 L0 220 Z"
        fill="url(#wave2)">
    <animate attributeName="d"
      values="
      M0 170 C 140 140, 250 215, 410 185 C 560 155, 760 215, 920 180 C 1060 150, 1130 185, 1200 168 L1200 220 L0 220 Z;
      M0 180 C 110 150, 290 170, 420 200 C 600 230, 760 150, 900 190 C 1040 225, 1130 150, 1200 175 L1200 220 L0 220 Z;
      M0 170 C 140 140, 250 215, 410 185 C 560 155, 760 215, 920 180 C 1060 150, 1130 185, 1200 168 L1200 220 L0 220 Z"
      dur="15s" repeatCount="indefinite"/>
  </path>

  <g opacity="0.45">
    <circle cx="100" cy="38" r="1.4" fill="#c0caf5"/>
    <circle cx="220" cy="28" r="1.2" fill="#7dcfff"/>
    <circle cx="340" cy="52" r="1.1" fill="#c0caf5"/>
    <circle cx="470" cy="30" r="1.5" fill="#bb9af7"/>
    <circle cx="620" cy="44" r="1.1" fill="#c0caf5"/>
    <circle cx="760" cy="26" r="1.3" fill="#7aa2f7"/>
    <circle cx="890" cy="50" r="1.1" fill="#c0caf5"/>
    <circle cx="1020" cy="34" r="1.5" fill="#bb9af7"/>
    <circle cx="1120" cy="48" r="1.2" fill="#7dcfff"/>
  </g>
</svg>
